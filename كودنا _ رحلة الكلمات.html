<style>
:root{--bg:#e8f6ef;--card:#fff;--line:#d5e8de;--tx:#16352a;--mut:#5d7a6d;--g1:#14c47e;--g2:#27e39a;--gd:#0f6e56;--bad:#e24b4a;--sh:#c9ddd2}
@media (prefers-color-scheme:dark){:root{--bg:#0b1c17;--card:#12281f;--line:#1d3d30;--tx:#e6f6ee;--mut:#8fb3a2;--gd:#27e39a;--sh:#05100c}}
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--tx);max-width:520px;margin:auto;padding:max(14px,env(safe-area-inset-top,0px)) 16px max(18px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;gap:12px}
header img{width:46px;height:46px;border-radius:14px;box-shadow:0 4px 0 var(--sh)}
.ti{flex:1}.ti b{display:block;font-size:20px;color:var(--gd)}.ti span{font-size:13px;color:var(--mut)}
.pill{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:7px 14px;font-size:14px;font-weight:700;box-shadow:0 3px 0 var(--sh)}
#msg{min-height:22px;text-align:center;font-size:14px;color:var(--mut)}
#map{perspective:700px;overflow:hidden;padding:6px 0 30px}
#path{display:flex;flex-direction:column;align-items:center;gap:26px;transform:rotateX(24deg);transform-origin:50% 0;transform-style:preserve-3d}
.cn{width:210px;padding:14px 16px;border-radius:22px;color:#fff;border:0;text-align:right;transform:translateZ(30px);box-shadow:0 9px 0 rgba(0,0,0,.28),0 22px 28px rgba(0,0,0,.22);transition:transform .15s}
.cn:nth-child(odd){margin-inline-start:70px}.cn:nth-child(even){margin-inline-end:70px}
.cn:active{transform:translateZ(30px) translateY(6px);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.cn b{display:block;font-size:19px}.cn span{font-size:13px;opacity:.95}
.cn.lk{background:#8b9a93!important;opacity:.65}
.cn.cur{animation:pu 1.6s ease-in-out infinite}
@keyframes pu{50%{transform:translateZ(46px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;font-size:16px;line-height:1.8;box-shadow:0 5px 0 var(--sh)}
.b{display:block;width:100%;height:52px;border-radius:15px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:17px;font-weight:700;box-shadow:0 5px 0 var(--sh);margin-top:10px;transition:transform .08s}
.b:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sh)}
.b.ok{background:var(--g1);border-color:var(--g1);color:#03211a;box-shadow:0 5px 0 #0c8a56}
.b.no{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 5px 0 #a32d2d}
.b.p{background:linear-gradient(135deg,var(--g2),var(--g1));border:0;color:#03211a;box-shadow:0 5px 0 #0c8a56}
.b.sm{display:inline-block;width:auto;padding:0 22px;height:46px}
#slots{display:flex;gap:8px;justify-content:center;margin:14px 0}
.s{width:46px;height:54px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-size:25px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--sh)}
.s.f{border-color:var(--g1)}.s.ok{background:var(--g1);color:#03211a}.s.no{border-color:var(--bad);animation:sh .4s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.t{height:54px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:24px;font-weight:700;color:var(--gd);box-shadow:0 5px 0 var(--sh)}
.t:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sh)}.t.u{opacity:.25}
svg.sc{width:100%;border-radius:14px;box-shadow:0 5px 0 var(--sh);display:block;margin-top:10px}
.hide{display:none!important}
</style>
</head>

const $=id=>document.getElementById(id);
const tg=window.Telegram&&Telegram.WebApp;if(tg){try{tg.ready();tg.expand()}catch(e){}}
let st={done:0,score:0};
try{const s=JSON.parse(localStorage.getItem("kodna2"));if(s&&typeof s.done==="number")st=s}catch(e){}
function save(){try{localStorage.setItem("kodna2",JSON.stringify(st))}catch(e){}}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(t){$("msg").textContent=t}
let L=0,ci=0,ty=0;
function go(){$("lv").classList.add("hide");$("map").classList.remove("hide");toast("");draw()}
function draw(){
 $("sc").textContent=st.score;$("path").innerHTML="";
 C.forEach((c,i)=>{const pr=Math.min(Math.max(st.done-i*4,0),4),lk=st.done<i*4;
  const b=document.createElement("button");b.className="cn"+(lk?" lk":"")+(!lk&&pr<4&&st.done>=i*4?" cur":"");
  b.style.background="linear-gradient(135deg,"+c.c+",#222)";
  b.innerHTML="<b>"+c.n+"</b><span>"+(lk?"مقفلة":"★".repeat(pr)+"☆".repeat(4-pr))+"</span>";
  b.onclick=()=>open(i);$("path").appendChild(b)});const cu=document.querySelector(".cn.cur");if(cu&&st.done>0)cu.scrollIntoView({block:"center"})}
function open(i){
 if(st.done<i*4){toast("أكمل البلد السابق أولاً");return}
 ci=i;ty=Math.min(Math.max(st.done-i*4,0),3);L=i*4+ty;
 $("map").classList.add("hide");$("lv").classList.remove("hide");toast("");
 $("lh").innerHTML="وصلنا <b>"+C[i].n+"</b><br><span style='font-size:14px;color:var(--mut)'>المرحلة "+(ty+1)+" من ٤ · "+NAMES[ty]+"</span>";
 [Q,P,Wd,Df][ty]()}
function finish(pts){
 if(L===st.done){st.done++;st.score+=pts;save()}$("sc").textContent=st.score;
 try{tg&&tg.HapticFeedback.notificationOccurred("success")}catch(e){}
 const n=L+1,last=n>=C.length*4;
 const b=document.createElement("button");b.className="b p";b.textContent=last?"خلصت الرحلة! الخريطة":"المرحلة التالية";
 b.onclick=()=>last?go():open(Math.floor(n/4));$("lb").appendChild(b);toast("صح! أحسنت")}
function mc(q,o,a){
 $("lb").innerHTML='<div class="card" style="margin-top:10px">'+q+'</div><div id="ops"></div>';
 shuf([0,1,2]).forEach(k=>{const b=document.createElement("button");b.className="b";b.textContent=o[k];
  b.onclick=()=>{if(k===a){b.classList.add("ok");document.querySelectorAll("#ops .b").forEach(x=>x.disabled=true);finish(10)}else{b.classList.add("no");b.disabled=true;toast("جرب مرة ثانية")}};$("ops").appendChild(b)})}
function Q(){const x=C[ci].q;mc(x[0],x[1],x[2])}
function P(){const x=C[ci].p;mc(x[0],x[1],x[2])}
let word,slots,fixed,tiles,hinted,locked;
function Wd(){
 const w=C[ci].w;word=Array.from(w[0]);slots=Array(word.length).fill(-1);fixed=Array(word.length).fill(false);
 const pool=Array.from("ابتجحدرزسعفقكلمنهوي").filter(c=>!word.includes(c));
 tiles=shuf(word.concat(shuf(pool).slice(0,Math.max(3,8-word.length)))).map(c=>({c,u:false}));hinted=0;locked=false;
 $("lb").innerHTML='<div class="card" style="margin-top:10px">التلميح: '+w[1]+'</div><div id="slots"></div><div id="tiles"></div><button class="b sm" id="bh">تلميح</button> <button class="b sm" id="bs">خلط</button>';
 $("bh").onclick=hint;$("bs").onclick=()=>{if(locked)return;const idx=[];tiles.forEach((t,i)=>{if(!t.u)idx.push(i)});const o=shuf(idx.map(i=>tiles[i]));idx.forEach((i,k)=>{tiles[i]=o[k]});rw()};rw()}
function rw(){
 $("slots").innerHTML="";slots.forEach((t,s)=>{const d=document.createElement("div");d.className="s"+(t>=0?" f":"")+(fixed[s]?" ok":"");d.textContent=t>=0?tiles[t].c:"";d.onclick=()=>{if(locked||fixed[s]||t<0)return;tiles[t].u=false;slots[s]=-1;rw()};$("slots").appendChild(d)});
 $("tiles").innerHTML="";tiles.forEach((t,i)=>{const b=document.createElement("button");b.className="t"+(t.u?" u":"");b.textContent=t.c;b.onclick=()=>{if(locked||t.u)return;const s=slots.indexOf(-1);if(s<0)return;slots[s]=i;t.u=true;rw();if(slots.indexOf(-1)<0)chk()};$("tiles").appendChild(b)})}
function chk(){
 if(slots.map(i=>tiles[i].c).join("")===word.join("")){locked=true;document.querySelectorAll(".s").forEach(e=>e.classList.add("ok"));$("bh").classList.add("hide");$("bs").classList.add("hide");finish(hinted?5:10)}
 else{locked=true;document.querySelectorAll(".s").forEach((e,s)=>{if(!fixed[s])e.classList.add("no")});toast("جرب مرة ثانية");
  setTimeout(()=>{slots.forEach((t,s)=>{if(!fixed[s]&&t>=0){tiles[t].u=false;slots[s]=-1}});locked=false;toast("");rw()},700)}}
function hint(){if(locked)return;let s=-1;for(let k=0;k<word.length;k++){if(fixed[k])continue;if(slots[k]<0||tiles[slots[k]].c!==word[k]){s=k;break}}
 if(s<0)return;if(slots[s]>=0){tiles[slots[s]].u=false;slots[s]=-1}
 const t=tiles.findIndex(x=>x.c===word[s]&&!x.u);if(t<0)return;slots[s]=t;tiles[t].u=true;fixed[s]=true;hinted++;rw();if(slots.indexOf(-1)<0)chk()}
const PT={1:[250,35],2:[70,40],3:[140,120],4:[219,66],5:[50,77],6:[166,28]};
function scene(d,hit,found){const a=i=>d.has(i);
 return '<svg class="sc" viewBox="0 0 300 180"><rect width="300" height="180" fill="#bfe8ff"/>'+
 '<circle cx="250" cy="35" r="'+(a(1)?13:20)+'" fill="'+(a(1)?"#ff9f43":"#ffd43b")+'"/>'+
 (a(2)?"":'<ellipse cx="70" cy="40" rx="30" ry="12" fill="#fff"/>')+
 '<rect y="130" width="300" height="50" fill="#e9c46a"/><rect x="110" y="85" width="60" height="50" fill="#f4e3c1"/>'+
 '<rect x="132" y="108" width="16" height="27" fill="'+(a(3)?"#2a9d8f":"#8d5524")+'"/>'+
 '<rect x="215" y="70" width="8" height="65" fill="#7b4a1e"/><ellipse cx="219" cy="66" rx="26" ry="10" fill="'+(a(4)?"#e76f51":"#2d9d4f")+'"/>'+
 '<rect x="38" y="70" width="4" height="65" fill="#555"/><rect x="42" y="70" width="'+(a(5)?14:26)+'" height="14" fill="#c0392b"/>'+
 (a(6)?"":'<path d="M150 30q8-8 16 0q8-8 16 0" stroke="#333" fill="none" stroke-width="2"/>')+
 (hit?[1,2,3,4,5,6].map(i=>'<circle data-i="'+i+'" cx="'+PT[i][0]+'" cy="'+PT[i][1]+'" r="22" fill="transparent"/>').join(""):"")+
 (found?[...found].map(i=>'<circle cx="'+PT[i][0]+'" cy="'+PT[i][1]+'" r="20" fill="none" stroke="#e24b4a" stroke-width="3"/>').join(""):"")+'</svg>'}
function Df(){
 const D=new Set(shuf([1,2,3,4,5,6]).slice(0,3)),F=new Set();
 $("lb").innerHTML='<div class="card" style="margin-top:10px">اوجد ٣ اختلافات بين الصورتين، وانقر عليها في الصورة السفلى. <b id="fc">٠/٣</b></div><div id="im"></div>';
 function r(){$("im").innerHTML=scene(new Set(),false)+scene(D,true,F);$("fc").textContent=F.size+"/3";
  $("im").lastChild.onclick=e=>{const i=+e.target.dataset.i;if(!i)return;if(F.has(i))return;if(D.has(i)){F.add(i);r();if(F.size===3)finish(15)}else toast("ليس هنا، جرب مرة ثانية")}}
 r()}
draw();
</script>
</body>
</html>
